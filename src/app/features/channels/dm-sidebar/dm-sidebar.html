<aside class="flex h-full min-h-0 flex-col text-white">
  <div class="flex h-14 shrink-0 items-center border-b border-[#35363c] px-2">
    <button
      type="button"
      class="flex w-full cursor-pointer items-center gap-3 rounded-md px-3 py-2 text-left text-gray-300 transition-colors hover:bg-white/5 hover:text-white"
    >
      <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6.5-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19.5C2 15.9 5.1 13 9 13s7 2.9 7 6.5c0 .8-.7 1.5-1.5 1.5h-11C2.7 21 2 20.3 2 19.5Zm14.2-6.1c3.3.4 5.8 2.7 5.8 5.6 0 .6-.4 1-1 1h-3.1c.1-.3.1-.7.1-1 0-2.2-.7-4.1-1.8-5.6Z"
        />
      </svg>

      <span>Friends</span>
    </button>
  </div>

  <div class="flex min-h-0 flex-1 flex-col p-2">
    <div class="mt-3 flex shrink-0 items-center justify-between px-3">
      <span class="text-xs font-semibold uppercase text-gray-400"> Direct Messages </span>

      <button
        type="button"
        class="cursor-pointer text-lg text-gray-400 hover:text-white"
        aria-label="New direct message"
        (click)="openModal()"
      >
        +
      </button>
    </div>
    <div>
      <div class="mt-2 min-h-0 flex-1 overflow-y-auto">
        <div class="flex flex-col gap-1">
          @for (conv of conversations(); track conv.conversationId) {
            <div
              class="flex items-center gap-3 cursor-pointer rounded-md px-2 py-2 hover:bg-white/5"
            >
              <div class="relative h-8 w-8 shrink-0">
                @if (conv.avatarUrl) {
                  <img
                    [src]="conv.avatarUrl"
                    [alt]="conv.displayName + ' avatar'"
                    class="h-full w-full rounded-full object-cover"
                  />
                } @else {
                  <div
                    class="flex h-full w-full items-center justify-center rounded-full bg-[#5865F2] font-semibold text-white"
                  >
                    {{ conv.displayName[0].toUpperCase() }}
                  </div>
                }

                @if (conv.otherUserId; as userId) {
                  @let online = presenceService.isOnline(userId);

                  <span
                    class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full border-2 border-[#2b2d31]"
                    [class.bg-green-500]="online"
                    [class.bg-red-500]="!online"
                    role="img"
                    [attr.aria-label]="online ? 'Online' : 'Offline'"
                    [attr.title]="online ? 'Online' : 'Offline'"
                  ></span>
                }
              </div>

              <div class="min-w-0 flex-1">
                <span class="block truncate">{{ conv.displayName }}</span>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <app-user-panel class="mt-auto block shrink-0"></app-user-panel>
</aside>

@if (isModalOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/70"
    (click)="closeModal()"
  >
    <div
      class="w-full max-w-md rounded-xl bg-[#313338] p-6 shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      Modal content
    </div>
  </div>
}
